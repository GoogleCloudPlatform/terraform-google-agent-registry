apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: terraform-google-agent-registry-agent-registry-agent-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Agent Registry Agent
    source:
      repo: https://github.com/GoogleCloudPlatform/terraform-google-agent-registry.git
      sourceType: git
      dir: /modules/agent-registry-agent
  ui:
    input:
      variables:
        agent_id:
          name: agent_id
          title: Agent Id
        filter:
          name: filter
          title: Filter
        location:
          name: location
          title: Location
        module_depends_on:
          name: module_depends_on
          title: Module Depends On
        wait_time:
          name: wait_time
          title: Wait Time
        project_id:
          name: project_id
          title: Project Id
    runtime:
      outputs:
        agent:
          visibility: VISIBILITY_ROOT
        agent_display_name:
          visibility: VISIBILITY_ROOT
        agent_urn:
          visibility: VISIBILITY_ROOT
